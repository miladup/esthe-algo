<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOVE</title>
    <style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: monospace;
  }
</style>
</head>
<body>

<div id="canvas" style="font-family: monospace; line-height: 20px;"></div>

<script>
const canvas = document.getElementById("canvas");

// Mot à dessiner
const word = "LOVE";

// Mot à répéter dans le dessin (toujours "LOVE")
const repeatedWord = "LOVE";

// Représentation ASCII simplifiée des lettres
const lettersMap = {
  L: [
    "L   ",
    "L   ",
    "L   ",
    "L   ",
    "L   ",
    "L   ",
    "L   ",
    "LLL"
  ],
  O: [
    "OOO",
    "O   O",
    "O   O",
    "O   O",
    "O   O",
    "O   O",
    "O   O",
    "OOO"
  ],
  V: [
    "V   V",
    "V   V",
    "V   V",
    " V V ",
    " V V ",
    " V V ",
    "  V  ",
    "  V  ",
    "  V  "
  ],
  E: [
    "EEE",
    "E    ",
    "E    ",
    "E    ",
    "EE  ",
    "E    ",
    "E    ",
    "E    ",
    "EEE"
  ]
};

// Boucle sur chaque lettre
letters = word.split("");
letters.forEach(letter => {
  const lines = lettersMap[letter];
  lines.forEach(line => {
    let newLine = "";
    for (let char of line) {
      if(char === " "){
        newLine += "&nbsp;&nbsp;"; // espace
      } else {
        newLine += repeatedWord + " ";
      }
    }
    canvas.innerHTML += newLine + "<br>";
  });
  canvas.innerHTML += "<br>"; // espace entre lettres
});
</script>

</body>
</html>
